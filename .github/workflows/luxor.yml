name: luxor-bot

on:
  schedule:
    # UTC-ben; a bot budapesti idő szerint dönt (TZ lent). A sorsolás szombaton 18:30-19:30 körül van.
    - cron: "12 7,8 * * 6"        # szombat reggel: tipp (9:12 körül télen és nyáron is)
    - cron: "*/20 17-22 * * 6"    # szombat este 20 percenként: megjött-e az eredmény
    - cron: "12 6-9 * * 0"        # vasárnap délelőtt óránként (12:00-ig): késve megjelenő eredmény
    - cron: "42 6,18 * * *"       # naponta kétszer: Telegram-parancsok (a Telegram 24 óráig őrzi őket)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: luxor-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Budapest
      LUXOR_BOT_TOKEN: ${{ secrets.LUXOR_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bot lépés
        run: python luxor_bot.py --once cron

      - name: Állapot visszamentése a repóba
        if: always()
        run: |
          git config user.name "luxor-bot"
          git config user.email "luxor-bot@users.noreply.github.com"
          for f in adat.csv bot_state.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "luxor: állapot $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase -X theirs --quiet && git push --quiet
          fi

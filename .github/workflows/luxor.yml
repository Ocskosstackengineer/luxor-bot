name: luxor-bot

on:
  schedule:
    - cron: "50 7,8 * * 6"   # tartalék szombat reggel: 9:50 (tél) / 9:50–10:50 (nyár)
    - cron: "12 9,10 * * 0"  # tartalék vasárnap délelőtt
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: luxor-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Budapest
      LUXOR_BOT_TOKEN: ${{ secrets.LUXOR_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bot lépés
        run: python luxor_bot.py --once cron

      - name: Állapot visszamentése a repóba
        if: always()
        run: |
          git config user.name "luxor-bot"
          git config user.email "luxor-bot@users.noreply.github.com"
          for f in adat.csv bot_state.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "luxor: állapot $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase -X theirs --quiet && git push --quiet
          fi

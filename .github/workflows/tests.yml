name: tests

# Minden kódváltozásnál lefutnak a beolvasó- és egészségfigyelés-tesztek.
# A bot saját állapot-commitjai (adat.csv, bot_state.json) nem indítják.
on:
  push:
    paths-ignore:
      - "adat.csv"
      - "bot_state.json"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
